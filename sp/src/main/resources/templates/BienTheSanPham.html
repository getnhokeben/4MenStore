<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biến Thể Sản Phẩm | 4MenStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- QR Code & Scanner Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/app-shell.js?v=ui-scale-20260822-2" defer></script>
    <style>
        /* ===== GIỮ NGUYÊN TOÀN BỘ CSS NHƯ CŨ ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --sw: 220px;
            --sbg: #2b1d0e;
            --sact: #7a5230;
            --gold: #c8a474;
            --bg: #f3f4f6;
            --white: #fff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --r: 8px;
            --success: #16a34a;
            --danger: #dc2626;
            --navy: #0b2a4a;
            --navy-hover: #061d36;
            --navy-active: #174d7d;
            --navy-soft: #eaf1f8;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.45;
            font-synthesis: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: var(--sw);
            background: var(--sbg);
            position: fixed;
            inset: 0 auto 0 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }
        .sb-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }
        .sb-logo img {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(200, 164, 116, .35);
        }
        .sb-nav {
            padding: 4px 0;
            flex: 1;
        }
        .ni {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: rgba(255, 255, 255, .65);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: all .13s;
            user-select: none;
        }
        .ni .ico {
            width: 18px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .ni .arr {
            margin-left: auto;
            font-size: 10px;
            opacity: .4;
            transition: transform .2s;
        }
        .ni:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }
        .ni.open-parent {
            color: var(--gold);
        }
        .active-row {
            background: var(--sact) !important;
            color: #fff !important;
            border-left-color: var(--gold) !important;
        }
        .submenu {
            overflow: hidden;
            max-height: 0;
            transition: max-height .25s ease;
        }
        .submenu.open {
            max-height: 400px;
        }
        .si-lnk {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px 9px 42px;
            color: rgba(255, 255, 255, .5);
            font-size: 12.5px;
            text-decoration: none;
            transition: all .12s;
            border-left: 3px solid transparent;
        }
        .si-lnk:hover {
            color: #fff;
            background: rgba(255, 255, 255, .05);
        }
        .si-lnk.active {
            color: var(--gold);
            font-weight: 600;
            border-left-color: var(--gold);
            background: rgba(122, 82, 48, .2);
        }
        .main {
            margin-left: var(--sw);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .topbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 24px;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .tb-lbl {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }
        .tb-bell {
            font-size: 17px;
            color: var(--muted);
            position: relative;
            cursor: pointer;
        }
        .tb-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
        }
        .tb-av {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--gold);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .content {
            padding: 20px 24px;
            flex: 1;
        }
        .page-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .fc {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px 18px;
            margin-bottom: 14px;
        }
        .fc .search-lbl {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
        }
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s;
            background: #f9fafb;
        }
        .search-box input:focus {
            border-color: var(--gold);
            background: #fff;
        }
        .search-box .s-ico {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 13px;
        }
        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filt {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 130px;
        }
        .filt label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }
        .filt select {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            background: #f9fafb;
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        .filt select:focus {
            border-color: var(--gold);
        }
        .price-range-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1.5;
            min-width: 180px;
        }
        .price-range-wrap label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--navy) 0%, var(--navy) var(--pct, 100%), #e5e7eb var(--pct, 100%), #e5e7eb 100%);
            outline: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--navy);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(16, 42, 86, .28);
        }
        .price-range-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .price-range-info .max-label {
            font-weight: 600;
            color: var(--text);
        }
        .act-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 14px;
        }
        .btn{height:36px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap}
        .btn:hover{background:var(--navy-hover);border-color:var(--navy-hover);color:#fff}
        .btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
        .btn-primary:hover{background:var(--navy-hover);border-color:var(--navy-hover)}
        .table-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: auto;
        }
        #tblWrap > table {
            min-width: 1500px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .col-stt{width:78px}
        .col-img{width:76px}
        .col-ma-sp{width:132px}
        .col-ten-sp{width:104px}
        .col-ma-ctsp{width:190px}
        .col-kich-co{width:78px}
        .col-mau-sac{width:86px}
        .col-loai-ao{width:150px}
        .col-kieu-dang{width:108px}
        .col-phong-cach{width:110px}
        .col-sl{width:74px}
        .col-price{width:136px}
        .col-status{width:112px}
        .col-actions{width:148px}
        thead tr {
            background: #f9fafb;
            border-bottom: 1.5px solid var(--border);
        }
        th {
            padding: 10px 12px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background .1s;
        }
        tbody tr:last-child {
            border-bottom: none;
        }
        tbody tr:hover {
            background: #fafafa;
        }
        td {
            padding: 10px 11px;
            font-size: 13px;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cell-center {
            text-align: center;
        }
        .cell-code,
        .cell-name,
        .cell-text {
            white-space: nowrap;
        }
        .cell-code .td-code {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        .cell-name {
            color: var(--text);
            font-weight: 500;
        }
        .td-num {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
        .stt-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .qr-select {
            width: 16px;
            height: 16px;
            accent-color: var(--navy);
            cursor: pointer;
            flex: 0 0 auto;
        }
        .td-code {
            font-family: monospace;
            font-size: 12px;
            font-weight: 700;
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            color: #374151;
            display: inline-block;
        }
        .img-thumb {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background: #f3f4f6;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .img-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .price-wrap .old-p {
            font-size: 11px;
            color: var(--muted);
            text-decoration: line-through;
            display: block;
            white-space: nowrap;
        }
        .price-wrap .new-p {
            font-size: 13px;
            font-weight: 700;
            color: #dc2626;
            white-space: nowrap;
        }
        .th-price,
        .td-price {
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .td-price .new-p,
        .td-price .price-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .td-price .new-p {
            color: #dc2626;
            font-weight: 800;
            white-space: nowrap;
        }
        .td-price .price-placeholder {
            color: var(--muted);
        }
        .badge-on {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-on::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #16a34a;
            display: block;
        }
        .badge-off {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            background: #fee2e2;
            color: #dc2626;
        }
        .badge-off::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #dc2626;
            display: block;
        }
        .act-btns {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }
        .ib {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1.5px solid var(--navy);
            background: var(--navy);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            transition: all .13s;
        }
        .ib:hover {
            background: var(--navy-hover);
            color: #fff;
            border-color: var(--navy-hover);
        }
        .toggle {
            position: relative;
            width: 38px;
            height: 21px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            inset: 0;
            background: #d1d5db;
            border-radius: 20px;
            transition: .3s;
        }
        .slider::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: .3s;
        }
        .toggle input:checked+.slider {
            background: #16a34a;
        }
        .toggle input:checked+.slider::before {
            transform: translateX(17px);
        }
        .pg {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: #f9fafb;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pg-info {
            font-size: 13px;
            color: var(--muted);
        }
        .pg-nav{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-left:auto;flex-wrap:wrap}
        .pg-btn {
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            border-radius: 6px;
            border: 1.5px solid var(--navy);
            background: var(--navy);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all .13s;
        }
        .pg-btn:hover:not(:disabled):not(.active){border-color:var(--navy);color:var(--navy);background:#eef4fb}
        .pg-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
        .pg-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .modal-bg.show {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            width: 92%;
            max-width: 550px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
            animation: mIn .2s ease;
        }
        @keyframes mIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.98);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .modal-head {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .modal-head h2 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .5px;
        }
        .modal-close {
            position: absolute;
            right: 18px;
            top: 14px;
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: none;
            background: var(--navy);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .modal-close:hover {
            background: var(--navy-hover);
            color: #fff;
        }
        .modal-body {
            padding: 22px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-foot {
            padding: 14px 22px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
            background: #f9fafb;
            border-radius: 0 0 12px 12px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        .detail-main-image {
            width: 180px;
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f8fafc;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
        }
        .detail-main-image img,
        .detail-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .detail-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .detail-item {
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px 10px;
            background: #fafafa;
        }
        .detail-item label {
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .detail-item span {
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
        }
        .detail-section-title {
            margin: 16px 0 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
        }
        .detail-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .detail-gallery .img-thumb {
            width: 88px;
            height: 88px;
        }
        .fg {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .fg label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
        }
        .fg input,
        .fg select {
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s;
            color: var(--text);
            background: #fff;
        }
        .fg input:focus,
        .fg select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200, 164, 116, .12);
        }
        .fg input:read-only {
            background: #f3f4f6;
            cursor: not-allowed;
        }
        /* Keep formatted prices visible even when they contain many digits. */
        .fg input.price-input {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            text-align: right;
            font-variant-numeric: tabular-nums;
            overflow-x: auto;
            text-overflow: clip;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
        }
        .toast-wrap {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 7px;
            pointer-events: none;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #1f2937;
            color: #fff;
            padding: 11px 16px;

            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .2);

        @keyframes tIn {
            from {
                opacity: 0;
                transform: translateY(10px);

                opacity: 1;
                transform: none;
            }
        }
        .toast.success {

                transform: rotate(360deg);

        .load-st {

            text-align: center;

            font-size: 34px;

            margin-bottom: 8px;
        }

        .search-combo{position:relative;width:100%;flex:1;font-family:inherit}
        .search-combo-display{width:100%;min-height:34px;padding:7px 32px 7px 10px;border:1px solid var(--border);border-radius:6px;background:#f9fafb;color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
        .search-combo-display::after{content:'v';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
        .search-combo.open .search-combo-display{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(200,164,116,.12)}
        .search-combo-panel{display:none;position:absolute;z-index:500;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 12px 28px rgba(0,0,0,.16);overflow:hidden}
        .search-combo.open .search-combo-panel{display:block}
        .search-combo-search{width:calc(100% - 14px);margin:7px;padding:7px 9px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:inherit;outline:none;background:#fff}
        .search-combo-search:focus{border-color:var(--gold)}
        .search-combo-list{max-height:220px;overflow:auto;padding:4px 0}

        .search-combo-option:hover,.search-combo-option.active{background:rgba(200,164,116,.14);color:#7a5230}
        .search-combo-empty{padding:9px 10px;font-size:13px;color:var(--muted)}
        select.search-combo-source{display:none!important}

        /* QR code button nhỏ */

            background: var(--navy-active);

        }
        .btn-qr:hover {
            background: var(--navy-hover);
            border-color: var(--navy-hover);

    </style>
    <style>
        /* Ảnh sản phẩm: bảng chỉ hiển thị ảnh đại diện, màn hình sửa hiển thị tối đa 3 ảnh */
        #mdVariant .modal-box { max-width: 760px; }

        .variant-images-note {
            margin-top: 4px;

        }

        .variant-image-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .variant-image-slot {
            position: relative;
            min-height: 132px;
            border: 2px dashed #e0cfae;
            border-radius: 10px;
            background: #fffaf0;
            overflow: hidden;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .15s;
        }

        .variant-image-slot:hover {
            border-color: var(--gold);
            background: #fbf1da;
            transform: translateY(-1px);
        }

        .variant-image-slot.has-image {
            border-style: solid;
            border-color: var(--border);
            background: #fff;
        }

        .variant-image-slot input[type=file] { display: none; }

        .variant-image-slot img {
            width: 100%;
            height: 132px;

        .variant-image-empty {

    </style>
</head>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
    const API = '/san-pham';
    // Phân trang 10 SPCT mỗi trang.
    const PG = 10;
    let page = 0, totalPg = 0, totalEl = 0, dbT = null;
    let allData = [];
    const selectedQrVariantIds = new Set();
    let dynamicMaxPrice = 0;
    // ID biến thể vừa cập nhật: dùng để giữ dòng vừa lưu không bị lọc giá cũ che mất.
    let lastUpdatedVariantId = null;
    // Chỉ dùng ngay sau khi lưu. SPCT vừa cập nhật được giữ hiển thị
    // kể cả khi nó tạm thời không khớp bộ lọc cũ.
    // Khi người dùng thay đổi bộ lọc, cờ này sẽ được tắt để lọc hoạt động bình thường.
    let forceShowUpdatedVariant = false;
    let kichCoOptions = [], mauSacOptions = [], loaiAoOptions = [], phongCachOptions = [], kieuDangOptions = [];
    let scanner = null;

    // -- TOAST --
    // Thực hiện xử lý nghiệp vụ của hàm toast2.
    function toast2(msg, type = 'success') {
        const ic = { success: '✅', error: '❌', info: 'ℹ️' };
        const w = document.getElementById('toastWrap');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<span>${ic[type]||'ℹ️'}</span>${msg}`;
        w.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300) }, 3000);
    }

    // -- SIDEBAR TOGGLE --
    // Xử lý tương tác người dùng cho toggle sub.
    function toggleSub(sid, aid) {
        const s = document.getElementById(sid), a = document.getElementById(aid);
        const op = s.classList.toggle('open');
        a.style.transform = op ? 'rotate(90deg)' : 'rotate(0deg)';
    }

    // -- UTILS --
    // Thực hiện xử lý nghiệp vụ của hàm esc.
    function esc(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
    // Thực hiện xử lý nghiệp vụ của hàm fmt.
    function fmt(n) { return (Math.round(Number(n || 0) / 1000) * 1000).toLocaleString('vi-VN') }
    // Thực hiện xử lý nghiệp vụ của hàm money raw.
    function moneyRaw(v) { return String(v || '').replace(/[^\d]/g, '') }
    // Thực hiện xử lý nghiệp vụ của hàm format money.
    function formatMoney(v) { const raw = moneyRaw(v); return raw ? Number(raw).toLocaleString('vi-VN') : '' }
    // Kiểm tra điều kiện và tính hợp lệ cho is positive money.
    function isPositiveMoney(v) { return Number(moneyRaw(v)) > 0 }
    // Kiểm tra điều kiện và tính hợp lệ cho is non negative int.
    function isNonNegativeInt(v) { return String(v ?? '').trim() !== '' && Number.isInteger(Number(v)) && Number(v) >= 0 }

    // Thực hiện xử lý nghiệp vụ của hàm api fetch.
    async function apiFetch(url, options = {}) {
        const headers = {
            'Accept': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            ...(options.headers || {})
        };
        return fetch(url, { ...options, credentials: 'same-origin', headers });
    }

    // Thực hiện xử lý nghiệp vụ của hàm api json.
    async function apiJson(url, options = {}) {
        const res = await apiFetch(url, options);
        const contentType = res.headers.get('content-type') || '';
        const text = await res.text();

        if (!res.ok) {
            let message = text || `HTTP ${res.status}`;
            if (contentType.includes('application/json')) {
                try {
                    const data = JSON.parse(text);
                    message = data.message || data.error || JSON.stringify(data);
                } catch {}
            } else if (/<!doctype html|<html/i.test(text)) {
                message = 'API trả về trang HTML. Vui lòng đăng nhập lại hoặc kiểm tra endpoint.';
            }
            throw new Error(message);
        }

        if (!text) return null;
        if (/<!doctype html|<html/i.test(text)) {
            throw new Error('API trả về trang HTML. Vui lòng đăng nhập lại hoặc kiểm tra endpoint.');
        }
        return JSON.parse(text);
    }

    // Thực hiện xử lý nghiệp vụ của hàm format money input.
    function formatMoneyInput(input) {
        const caret = input.selectionStart || 0;
        const digitsBeforeCaret = moneyRaw(input.value.slice(0, caret)).length;
        input.value = formatMoney(input.value);
        let nextCaret = input.value.length;
        let seenDigits = 0;
        for (let i = 0; i < input.value.length; i++) {
            if (/\d/.test(input.value[i])) seenDigits++;
            if (seenDigits >= digitsBeforeCaret) {
                nextCaret = i + 1;
                break;
            }
        }
        input.setSelectionRange(nextCaret, nextCaret);
        if (!input.dataset.roundMoneyBound) {
            input.dataset.roundMoneyBound = 'true';
            input.addEventListener('blur', () => {
                const value = Number(moneyRaw(input.value) || 0);
                input.value = value ? formatMoney(Math.round(value / 1000) * 1000) : '';
            });
        }
    }
    // Mỗi biến thể có tối đa 3 ảnh. Ảnh đầu tiên là ảnh đại diện trong bảng.
    let variantImages = [];
    let variantImagesChanged = false;

    // Thực hiện xử lý nghiệp vụ của hàm image url from value.
    function imageUrlFromValue(value) {
        if (!value) return '';
        if (typeof value === 'string') return normalizeImageUrl(value);
        if (typeof value === 'object') {
            return normalizeImageUrl(value.url || value.hinhAnh || value.hinhAnhUrl || value.duongDan || value.path || '');
        }
        return '';
    }

    // Thực hiện xử lý nghiệp vụ của hàm normalize image url.
    function normalizeImageUrl(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        if (raw.startsWith('blob:') || raw.startsWith('data:') || raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('/')) {
            return raw;
        }
        if (raw.startsWith('uploads/')) return '/' + raw;
        return '/uploads/' + raw;
    }

    // Tải hoặc truy xuất dữ liệu cho get variant image urls.
    function getVariantImageUrls(variant, includeProductFallback = true) {
        const images = [];
        const add = value => {
            const url = imageUrlFromValue(value);
            if (url && !images.includes(url)) images.push(url);
        };
        const addMany = value => {
            if (!value) return;
            if (typeof value === 'string') {
                const text = value.trim();
                if (!text) return;
                if (text.startsWith('[')) {
                    try {
                        const parsed = JSON.parse(text);
                        (Array.isArray(parsed) ? parsed : [parsed]).forEach(add);
                        return;
                    } catch {
                        add(text);
                        return;
                    }
                }
                add(text);
                return;
            }
            (Array.isArray(value) ? value : [value]).forEach(add);
        };

        add(variant?.hinhAnh);
        add(variant?.hinhAnhChinh);
        add(variant?.imageUrl);

        const extras = variant?.danhSachHinhAnh || variant?.danhSachHinhAnhPhu || variant?.hinhAnhPhu || [];
        addMany(extras);

        // Dữ liệu cũ chỉ có ảnh ở sản phẩm: vẫn hiển thị được để không mất ảnh cũ.
        if (includeProductFallback && !images.length) {
            add(variant?.sanPham?.hinhAnhChinh);
            add(variant?.sanPham?.hinhAnh);
            const productExtras = variant?.sanPham?.danhSachHinhAnhPhu || variant?.sanPham?.danhSachHinhAnh || [];
            addMany(productExtras);
        }

        return images.slice(0, 3);
    }

    // Thực hiện xử lý nghiệp vụ của hàm detail value.
    function detailValue(value) {
        const text = String(value ?? '').trim();
        return text ? esc(text) : '–';
    }

    // Xử lý tương tác người dùng cho open variant detail.
    function openVariantDetail(id) {
        const variant = allData.find(v => Number(v.idSpct) === Number(id));
        if (!variant) {
            toast2('Không tìm thấy biến thể', 'error');
            return;
        }

        const images = getVariantImageUrls(variant, false);
        const mainImage = images[0];
        const mainImageHtml = mainImage
            ? `<img src="${esc(mainImage)}" alt="Ảnh riêng biến thể" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-image\\'></i>'">`
            : `<i class="fas fa-image"></i>`;
        const galleryHtml = images.length
            ? images.map((url, index) => `
                <div class="img-thumb" title="Ảnh riêng ${index + 1}">
                    <img src="${esc(url)}" alt="Ảnh riêng biến thể ${index + 1}">
                </div>

    // Xử lý thao tác đóng, xóa hoặc hủy cho clear local image preview.
    function clearLocalImagePreview(image) {
        if (image?.previewUrl && String(image.previewUrl).startsWith('blob:')) {
            URL.revokeObjectURL(image.previewUrl);
        }
    }

    // Thực hiện xử lý nghiệp vụ của hàm reset variant image editor.
    function resetVariantImageEditor(variant) {
        variantImages.forEach(clearLocalImagePreview);
        variantImages = getVariantImageUrls(variant).map(url => ({
            url,
            previewUrl: url,
            file: null
        }));
        variantImagesChanged = false;
        renderVariantImageSlots();
    }

    // Hiển thị và đồng bộ giao diện cho render variant image slots.
    function renderVariantImageSlots() {
        const wrap = document.getElementById('vImageSlots');
        if (!wrap) return;

        wrap.innerHTML = [0, 1, 2].map(index => {
            const image = variantImages[index];
            const label = index === 0 ? 'Ảnh đại diện' : `Ảnh ${index + 1}`;

            if (image) {
                const src = esc(image.previewUrl || image.url || '');
                return `
                    <label class="variant-image-slot has-image" title="Bấm để thay ${label.toLowerCase()}">
                        ${index === 0 ? '<span class="variant-image-badge">Ảnh đại diện</span>' : ''}
                        <img src="${src}" alt="${label}" onerror="this.closest('.variant-image-slot').classList.remove('has-image');this.remove()">
                        <input type="file" accept="image/*" onchange="replaceVariantImage(this, ${index})">
                        <button type="button" class="variant-image-remove" onclick="event.preventDefault(); event.stopPropagation(); removeVariantImage(${index})" title="Xóa ảnh">
                            <i class="fas fa-times"></i>
                        </button>
                    </label>
                `;
            }

            return `
                <label class="variant-image-slot" title="Bấm để tải ${label.toLowerCase()}">
                    ${index === 0 ? '<span class="variant-image-badge">Ảnh đại diện</span>' : ''}
                    <span class="variant-image-empty">
                        <i class="fas fa-image"></i>
                        <span>${index === 0 ? 'Tải ảnh đại diện' : `Thêm ảnh ${index + 1}`}</span>
                    </span>
                    <input type="file" accept="image/*" onchange="replaceVariantImage(this, ${index})">
                </label>
            `;
        }).join('');
    }

    // Thực hiện xử lý nghiệp vụ của hàm replace variant image.
    function replaceVariantImage(input, index) {
        const file = input?.files?.[0];
        if (!file) return;

        clearLocalImagePreview(variantImages[index]);
        variantImages[index] = {
            url: '',
            previewUrl: URL.createObjectURL(file),
            file
        };
        variantImagesChanged = true;
        renderVariantImageSlots();
    }

    // Xử lý thao tác đóng, xóa hoặc hủy cho remove variant image.
    function removeVariantImage(index) {
        clearLocalImagePreview(variantImages[index]);
        variantImages.splice(index, 1);
        variantImagesChanged = true;
        renderVariantImageSlots();
    }

    // Thực hiện xử lý nghiệp vụ của hàm upload variant images.
    async function uploadVariantImages() {
        const uploadedUrls = [];

        for (const image of variantImages) {
            if (image?.file) {
                const fd = new FormData();
                fd.append('file', image.file);

                const r = await apiFetch(`${API}/upload-anh`, {
                    method: 'POST',
                    body: fd
                });
                const responseText = await r.text();

                if (!r.ok) throw new Error(responseText || 'Không thể upload ảnh');
                const data = responseText ? JSON.parse(responseText) : {};
                const url = imageUrlFromValue(data);

                if (!url) throw new Error('Server không trả về đường dẫn ảnh');
                uploadedUrls.push(url);
            } else {
                const url = imageUrlFromValue(image);
                if (url) uploadedUrls.push(url);
            }
        }

        return uploadedUrls.slice(0, 3);
    }

    // Xử lý thao tác đóng, xóa hoặc hủy cho close modal.
    function closeModal(id) { document.getElementById(id).classList.remove('show') }
    document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show') }));

    // -- LỌC KHOẢNG GIÁ --
    // Thực hiện xử lý nghiệp vụ của hàm to safe price.
    function toSafePrice(value) {
        const price = Number(value ?? 0);
        return Number.isFinite(price) && price >= 0 ? price : 0;
    }

    // Thực hiện xử lý nghiệp vụ của hàm price slider step.
    function priceSliderStep(maxPrice) {
        return 1000;
    }

    // Thực hiện xử lý nghiệp vụ của hàm price slider max.
    function priceSliderMax(maxPrice) {
        const safeMax = toSafePrice(maxPrice);
        return safeMax;
    }

    // Tạo hoặc cập nhật dữ liệu/trạng thái cho setup price range.
    function setupPriceRange(options = {}) {
        const { includeUpdatedPrice = false, resetToMax = false } = options;
        const range = document.getElementById('priceRange');
        const priceLabel = document.getElementById('priceLabel');
        const maxPriceLabel = document.getElementById('maxPriceLabel');

        const oldMax = toSafePrice(range?.max);
        const oldValue = toSafePrice(range?.value);
        const wasAtOldMax = oldMax === 0 || oldValue >= oldMax;

        const actualMaxPrice = allData.reduce(
            (max, variant) => Math.max(max, toSafePrice(variant?.donGia)),
            0
        );
        dynamicMaxPrice = priceSliderMax(actualMaxPrice);

        const updatedVariant = lastUpdatedVariantId == null
            ? null
            : allData.find(v => Number(v.idSpct) === Number(lastUpdatedVariantId));
        const updatedPrice = toSafePrice(updatedVariant?.donGia);

        let nextValue = oldValue;
        // Lần đầu tải, người dùng đang để mức tối đa, hoặc vừa sửa giá cao hơn
        // khoảng đang chọn: mở rộng mức lọc để SPCT đó không bị ẩn.
        if (resetToMax || oldMax === 0 || wasAtOldMax || (includeUpdatedPrice && updatedPrice > oldValue)) {
            nextValue = dynamicMaxPrice;
        } else {
            nextValue = Math.min(oldValue, dynamicMaxPrice);
        }

        if (range) {
            range.disabled = false;
            range.min = '0';
            range.max = String(dynamicMaxPrice || 0);
            range.step = String(priceSliderStep(dynamicMaxPrice));
            range.value = String(nextValue);
            range.title = 'Kéo để lọc các SPCT có đơn giá không vượt quá mức đã chọn';
        }
        if (maxPriceLabel) maxPriceLabel.textContent = fmt(dynamicMaxPrice) + ' đ';
        if (priceLabel) updatePrice(nextValue);
    }

    // Tạo hoặc cập nhật dữ liệu/trạng thái cho update price.
    function updatePrice(value) {
        const range = document.getElementById('priceRange');
        const max = toSafePrice(range?.max);
        const current = Math.min(toSafePrice(value), max || 0);
        const pct = max ? (current / max * 100).toFixed(1) : 100;

        if (range) range.style.setProperty('--pct', pct + '%');
        const priceLabel = document.getElementById('priceLabel');
        if (priceLabel) {
            priceLabel.textContent = max ? `0 đ - ${fmt(current)} đ` : 'Tất cả';
        }
    }

    // Tải hoặc truy xuất dữ liệu cho fetch catalog.
    async function fetchCatalog(path) {
        const data = await apiJson(`${API}/danh-muc/${path}`);
        return Array.isArray(data) ? data : (data.content || []);
    }

    // Thực hiện xử lý nghiệp vụ của hàm fill variant select.
    function fillVariantSelect(id, items, valueKey, labelKey, placeholder) {
        const el = document.getElementById(id);
        if (!el) return;
        const current = el.value;
        el.innerHTML = `<option value="">${placeholder}</option>`;
        items.forEach(item => {
            const value = item[valueKey];
            if (value == null) return;
            const o = document.createElement('option');
            o.value = String(value);
            o.textContent = item[labelKey] || '';
            if (String(value) === String(current)) o.selected = true;
            el.appendChild(o);
        });
    }

    // Tải hoặc truy xuất dữ liệu cho load variant catalogs.
    async function loadVariantCatalogs() {
        try {
            [kichCoOptions, mauSacOptions, loaiAoOptions, phongCachOptions, kieuDangOptions] = await Promise.all([
                fetchCatalog('kich-co'),
                fetchCatalog('mau-sac'),
                fetchCatalog('loai-ao'),
                fetchCatalog('phong-cach-mac'),
                fetchCatalog('kieu-dang')
            ]);
            fillVariantSelect('vSize', kichCoOptions, 'idKichCo', 'tenKichCo', 'Chọn kích cỡ');
            fillVariantSelect('vMau', mauSacOptions, 'idMauSac', 'tenMauSac', 'Chọn màu sắc');
            fillVariantSelect('vLoaiAo', loaiAoOptions, 'idLoaiAo', 'tenLoai', 'Chọn loại áo');
            fillVariantSelect('vPhongCach', phongCachOptions, 'idPhongCachMac', 'tenPhongCach', 'Chọn phong cách');
            fillVariantSelect('vKieuDang', kieuDangOptions, 'idKieuDang', 'tenKieuDang', 'Chọn kiểu dáng');
        } catch (e) {
            toast2('Không tải được danh mục biến thể: ' + e.message, 'error');
        }
    }

    // -- LOAD TẤT CẢ BIẾN THỂ --
    // Thực hiện xử lý nghiệp vụ của hàm as array.
    function asArray(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== 'object') return [];

        // Chấp nhận các kiểu phản hồi thường gặp: Page của Spring, data/content,
        // result/content hoặc danh sách nằm trực tiếp trong data/result/items.
        for (const key of ['content', 'data', 'result', 'items']) {
            const value = payload[key];
            if (Array.isArray(value)) return value;
            if (value && typeof value === 'object') {
                const nested = asArray(value);
                if (nested.length) return nested;
            }
        }
        return [];
    }

    // Tải hoặc truy xuất dữ liệu cho fetch all products.
    async function fetchAllProducts() {
        const size = 200;
        const products = [];
        const pageSignatures = new Set();
        let currentPage = 0;
        let totalPages = 1;

        do {
            const data = await apiJson(`${API}/hien-thi?page=${currentPage}&size=${size}&sort=idSp,asc`);
            const currentItems = asArray(data);
            const signature = currentItems.map(item => item?.idSp ?? '').join('|');

            // Tránh vòng lặp nếu server bỏ qua tham số page và trả cùng một trang.
            if (signature && pageSignatures.has(signature)) break;
            if (signature) pageSignatures.add(signature);
            products.push(...currentItems);

            const serverTotalPages = Number(data?.totalPages ?? data?.data?.totalPages ?? data?.result?.totalPages);
            if (Number.isFinite(serverTotalPages) && serverTotalPages > 0) {
                totalPages = serverTotalPages;
            } else if (currentItems.length < size) {
                break;
            } else {
                totalPages = currentPage + 2;
            }
            currentPage++;
        } while (currentPage < totalPages && currentPage < 1000);

        // Loại dữ liệu lặp khi API trả về trùng trang.
        return [...new Map(products.filter(p => p?.idSp != null).map(p => [p.idSp, p])).values()];
    }

    // Tải hoặc truy xuất dữ liệu cho load all.
    async function loadAll() {
        document.getElementById('tblWrap').innerHTML = '<div class="load-st"><div class="spin"></div><div style="margin-top:10px">Đang tải toàn bộ biến thể...</div></div>';
        try {
            const products = await fetchAllProducts();
            const failedProducts = [];

            const results = await Promise.all(products.map(async p => {
                try {
                    const variants = asArray(await apiJson(`${API}/bien-the/${p.idSp}`));
                    return variants.map(v => ({ ...v, sanPham: p }));
                } catch (e) {
                    failedProducts.push(p.maSp || p.idSp);
                    return [];
                }
            }));

            // Khử trùng theo idSpct; biến thể hết tồn vẫn được hiển thị ở cuối bảng.
            allData = [...new Map(results.flat()
                .filter(v => v?.idSpct != null)
                .map(v => [v.idSpct, v])).values()];
            fillFilters();
            setupPriceRange();
            go(0);

            if (failedProducts.length) {
                toast2(`Không tải được biến thể của ${failedProducts.length} sản phẩm. Kiểm tra endpoint /bien-the/{idSp}.`, 'error');
            }
        } catch (e) {
            document.getElementById('tblWrap').innerHTML = `<div class="empty-st"><span>⚠️</span><p>Không kết nối được server.<br><small>${esc(e.message)}</small></p></div>`;
        }
    }

    // -- FILL FILTER OPTIONS --
    // Thực hiện xử lý nghiệp vụ của hàm fill filters.
    function fillFilters() {
        const sets = {
            fMau: new Set(),
            fKich: new Set(),
            fLoai: new Set(),
            fKieu: new Set(),
            fPhongCach: new Set()
        };
        allData.forEach(v => {
            if (v.mauSac?.tenMauSac) sets.fMau.add(v.mauSac.tenMauSac);
            if (v.kichCo?.tenKichCo) sets.fKich.add(v.kichCo.tenKichCo);
            if (v.loaiAo?.tenLoai) sets.fLoai.add(v.loaiAo.tenLoai);
            if (v.kieuDang?.tenKieuDang) sets.fKieu.add(v.kieuDang.tenKieuDang);
            if (v.phongCachMac?.tenPhongCach) sets.fPhongCach.add(v.phongCachMac.tenPhongCach);
        });
        fillSel('fMau', [...sets.fMau].sort(), 'Chọn màu sắc');
        fillSel('fKich', [...sets.fKich].sort(), 'Chọn kích cỡ');
        fillSel('fLoai', [...sets.fLoai].sort(), 'Chọn loại áo');
        fillSel('fKieu', [...sets.fKieu].sort(), 'Chọn kiểu dáng');
        fillSel('fPhongCach', [...sets.fPhongCach].sort(), 'Chọn phong cách');
    }

    // Thực hiện xử lý nghiệp vụ của hàm fill sel.
    function fillSel(id, arr, ph) {
        const el = document.getElementById(id);
        if (!el) return;
        const cur = el.value;
        el.innerHTML = `<option value="">${ph}</option>`;
        arr.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; if (v === cur) o.selected = true; el.appendChild(o) });
    }

    // Kiểm tra biến thể còn hàng để cho phép bật trạng thái bán.
    function isVisibleVariant(v) {
        return Number(v?.soLuongTon || 0) > 0;
    }

    // -- DEBOUNCE + FILTER --
    // Xử lý thao tác đóng, xóa hoặc hủy cho clear updated variant override.
    function clearUpdatedVariantOverride() {
        forceShowUpdatedVariant = false;
        lastUpdatedVariantId = null;
    }

    // Thực hiện xử lý nghiệp vụ của hàm deb.
    function deb() {
        clearTimeout(dbT);
        dbT = setTimeout(() => go(0), 350);
    }

    // Tải hoặc truy xuất dữ liệu cho get filtered.
    function getFiltered() {
        const kw = document.getElementById('kw').value.trim().toLowerCase();
        const fMau = document.getElementById('fMau').value;
        const fKich = document.getElementById('fKich').value;
        const fLoai = document.getElementById('fLoai').value;
        const fKieu = document.getElementById('fKieu').value;
        const fPhongCach = document.getElementById('fPhongCach').value;
        const fTT = document.getElementById('fTT').value;
        const maxPrice = toSafePrice(document.getElementById('priceRange').value);
        const shouldFilterByPrice = dynamicMaxPrice > 0 && maxPrice < dynamicMaxPrice;

        const filtered = allData.filter(v => {
            if (kw) {
                const ma = (v.maChiTietSanPham || '').toLowerCase();
                const maSp = (v.sanPham?.maSp || '').toLowerCase();
                if (!ma.includes(kw) && !maSp.includes(kw)) return false;
            }
            if (fMau && v.mauSac?.tenMauSac !== fMau) return false;
            if (fKich && v.kichCo?.tenKichCo !== fKich) return false;
            if (fLoai && v.loaiAo?.tenLoai !== fLoai) return false;
            if (fKieu && v.kieuDang?.tenKieuDang !== fKieu) return false;
            if (fPhongCach && v.phongCachMac?.tenPhongCach !== fPhongCach) return false;
            if (fTT !== '') {
                const active = fTT === 'true';
                if (v.trangThai !== active) return false;
            }
            if (shouldFilterByPrice && toSafePrice(v.donGia) > maxPrice) return false;
            return true;
        });

        return filtered.sort((left, right) => {
            const leftOutOfStock = Number(left.soLuongTon || 0) <= 0;
            const rightOutOfStock = Number(right.soLuongTon || 0) <= 0;
            return Number(leftOutOfStock) - Number(rightOutOfStock);
        });
    }

    // Thực hiện xử lý nghiệp vụ của hàm go.
    function go(pg = 0) {
        page = pg;
        const filtered = getFiltered();
        totalEl = filtered.length;
        totalPg = Math.max(1, Math.ceil(totalEl / PG));
        if (page >= totalPg) page = 0;
        const slice = filtered.slice(page * PG, page * PG + PG);
        render(slice);
        renderPg();
    }

            `;
            return `<tr>
                <td class="td-num">

                               ${selectedQrVariantIds.has(v.idSpct) ? 'checked' : ''}
                               onclick="event.stopPropagation()"
                               onchange="toggleQrSelection(${v.idSpct}, this.checked)">

                <td class="cell-center">${esc(v.kichCo?.tenKichCo||'–')}</td>
                <td class="cell-center">${esc(v.mauSac?.tenMauSac||'–')}</td>
                <td class="cell-text" title="${esc(v.loaiAo?.tenLoai||'–')}">${esc(v.loaiAo?.tenLoai||'–')}</td>
                <td class="cell-text" title="${esc(v.kieuDang?.tenKieuDang||'–')}">${esc(v.kieuDang?.tenKieuDang||'–')}</td>
                <td class="cell-text" title="${esc(v.phongCachMac?.tenPhongCach||'–')}">${esc(v.phongCachMac?.tenPhongCach||'–')}</td>
                <td class="td-num">${v.soLuongTon??'–'}</td>
                <td class="td-price">${priceHtml}</td>
                <td class="cell-center">${badge}</td>
                <td>${actions}</td>
            </tr>`;
        }).join('');

        const html = `
            <table>

    // Xử lý tương tác người dùng cho toggle qr selection.
    function toggleQrSelection(id, checked) {
        if (checked) selectedQrVariantIds.add(id);
        else selectedQrVariantIds.delete(id);
        syncQrSelectPageCheckbox();
    }

    // Xử lý tương tác người dùng cho toggle current page selection.
    function toggleCurrentPageSelection(checked) {
        const pageVariants = getFiltered().slice(page * PG, page * PG + PG);
        pageVariants.forEach(v => {
            if (v?.idSpct == null) return;
            if (checked) selectedQrVariantIds.add(v.idSpct);
            else selectedQrVariantIds.delete(v.idSpct);
        });
        go(page);
    }

    // Thực hiện xử lý nghiệp vụ của hàm sync qr select page checkbox.
    function syncQrSelectPageCheckbox(list = getFiltered().slice(page * PG, page * PG + PG)) {
        const selectAll = document.getElementById('qrSelectPage');
        if (!selectAll) return;
        const ids = list.map(v => v.idSpct).filter(id => id != null);
        const checkedCount = ids.filter(id => selectedQrVariantIds.has(id)).length;
        selectAll.checked = ids.length > 0 && checkedCount === ids.length;
        selectAll.indeterminate = checkedCount > 0 && checkedCount < ids.length;
    }

    // Tải hoặc truy xuất dữ liệu cho get selected qr variants.
    function getSelectedQrVariants() {
        const selectedIds = new Set(selectedQrVariantIds);
        return allData.filter(v => selectedIds.has(v.idSpct));
    }

    // -- PAGINATION (giữ nguyên) --
    // Hiển thị và đồng bộ giao diện cho render pg.
    function renderPg() {
        const area = document.getElementById('pgWrap');
        if (totalPg <= 1) { area.style.display = 'none'; area.innerHTML = ''; return }
        area.style.display = 'flex';
        let s = Math.max(0, page - 2), e = Math.min(totalPg, s + 5);
        if (e - s < 5) s = Math.max(0, e - 5);
        let nums = '';
        if (s > 0) { nums += `<button class="pg-btn" onclick="go(0)">1</button>`; if (s > 1) nums += `<span style="padding:0 4px;color:var(--muted)">…</span>` }
        for (let i = s; i < e; i++) nums += `<button class="pg-btn ${i===page?'active':''}" onclick="go(${i})">${i+1}</button>`;
        if (e < totalPg) { if (e < totalPg - 1) nums += `<span style="padding:0 4px;color:var(--muted)">…</span>`; nums += `<button class="pg-btn" onclick="go(${totalPg-1})">${totalPg}</button>` }
        area.innerHTML = `
            <div class="pg-info">Trang ${page+1}/${totalPg} • ${totalEl} biến thể</div>
            <div class="pg-nav">
                <button class="pg-btn" onclick="go(0)" ${page===0?'disabled':''}>«</button>
                <button class="pg-btn" onclick="go(${page-1})" ${page===0?'disabled':''}>← Trước</button>
                ${nums}
                <button class="pg-btn" onclick="go(${page+1})" ${page>=totalPg-1?'disabled':''}>Sau →</button>
                <button class="pg-btn" onclick="go(${totalPg-1})" ${page>=totalPg-1?'disabled':''}>»</button>
            </div>`;
    }

    // -- EXPORT EXCEL (giữ nguyên) --
    // Thực hiện xử lý nghiệp vụ của hàm export excel.
    async function exportExcel() {
        const filtered = getFiltered();
        if (!filtered.length) { toast2('Không có dữ liệu để xuất', 'info'); return }
        toast2('Đang xuất...', 'info');
        try {
            const rows = [
                ['STT', 'Mã SP', 'Tên SP', 'Mã CTSP', 'Kích cỡ', 'Màu sắc', 'Loại áo', 'Kiểu dáng', 'Phong cách', 'SL tồn', 'Đơn giá', 'Trạng thái']
            ];
            filtered.forEach((v, i) => {
                rows.push([
                    i + 1,
                    v.sanPham?.maSp || '',
                    v.sanPham?.tenSp || '',
                    v.maChiTietSanPham || '',
                    v.kichCo?.tenKichCo || '',
                    v.mauSac?.tenMauSac || '',
                    v.loaiAo?.tenLoai || '',
                    v.kieuDang?.tenKieuDang || '',
                    v.phongCachMac?.tenPhongCach || '',
                    v.soLuongTon ?? 0,
                    Number(v.donGia || 0),
                    v.trangThai !== false ? 'Đang bán' : 'Ngừng bán'
                ]);

            XLSX.utils.book_append_sheet(wb, ws, 'Biến thể');
            XLSX.writeFile(wb, `4MenStore_BienThe_${new Date().toISOString().slice(0,10)}.xlsx`);

    // Xử lý tương tác người dùng cho toggle variant status.
    async function toggleVariantStatus(id, cb) {
        const status = cb.checked;
        const variant = allData.find(v => Number(v.idSpct) === Number(id));
        if (status && !isVisibleVariant(variant)) {
            cb.checked = false;
            toast2('Biến thể đã hết tồn nên không thể bật bán.', 'error');
            return;
        }
        cb.disabled = true;
        try {
            const r = await apiFetch(`${API}/bien-the/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ trangThai: status, nguoiThucHien: 'Admin' })
            });
            const text = await r.text();
            if (!r.ok) throw new Error(text || `HTTP ${r.status}`);

            const idx = allData.findIndex(v => v.idSpct === id);
            if (idx !== -1) allData[idx].trangThai = status;
            toast2(status ? 'Đã bật biến thể' : 'Đã ngừng biến thể');
            go(page);
        } catch (e) {
            cb.checked = !status;
            toast2('Không thể đổi trạng thái: ' + (e.message || e), 'error');
        } finally {
            cb.disabled = false;
        }
    }

    // ========== ĐÃ SỬA LẠI SAVE VARIANT ==========
    // Tạo hoặc cập nhật dữ liệu/trạng thái cho save variant.
    async function saveVariant() {
        const id = document.getElementById('variantId').value;
        if (!id) { toast2('Không có ID biến thể', 'error'); return; }

        const requiredSelects = [
            ['vLoaiAo', 'loại áo'],
            ['vKieuDang', 'kiểu dáng'],
            ['vPhongCach', 'phong cách'],
            ['vMau', 'màu sắc'],
            ['vSize', 'kích cỡ']
        ];
        for (const [fieldId, label] of requiredSelects) {
            if (!document.getElementById(fieldId).value) {
                toast2(`Vui lòng chọn ${label}`, 'error');
                return;
            }
        }
        if (!isPositiveMoney(document.getElementById('vDonGia').value)) {
            toast2('Đơn giá phải lớn hơn 0', 'error');
            return;
        }
        if (!isNonNegativeInt(document.getElementById('vSoLuong').value)) {
            toast2('Số lượng tồn phải là số nguyên không âm', 'error');
            return;
        }

        const payload = {
            idLoaiAo: parseInt(document.getElementById('vLoaiAo').value),
            idKieuDang: parseInt(document.getElementById('vKieuDang').value),
            idPhongCachMac: parseInt(document.getElementById('vPhongCach').value),
            idMauSac: parseInt(document.getElementById('vMau').value),
            idKichCo: parseInt(document.getElementById('vSize').value),
            donGia: parseFloat(moneyRaw(document.getElementById('vDonGia').value)) || 0,
            soLuongTon: parseInt(document.getElementById('vSoLuong').value) || 0,
            trangThai: (parseInt(document.getElementById('vSoLuong').value) || 0) > 0 && document.getElementById('vTrangThai').checked,
            nguoiThucHien: 'Admin'
        };

        let savedImageUrls = null;
        if (variantImagesChanged) {
            try {
                savedImageUrls = await uploadVariantImages();
            } catch (e) {
                toast2('Không thể upload ảnh: ' + (e.message || e), 'error');
                return;
            }
            payload.hinhAnh = savedImageUrls[0] || null;
            payload.danhSachHinhAnh = savedImageUrls;
        }

        try {
            const r = await apiFetch(`${API}/bien-the/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (r.ok) {
                const text = await r.text();
                let updated = null;
                try { updated = text ? JSON.parse(text) : null; } catch {}
                toast2('Cập nhật biến thể thành công!');
                closeModal('mdVariant');

                const idx = allData.findIndex(v => Number(v.idSpct) === Number(id));
                if (idx !== -1) {
                    const oldVariant = allData[idx];
                    const serverVariant = updated && typeof updated === 'object' && !Array.isArray(updated)
                        ? (updated.data || updated.result || updated)
                        : {};

                    const localUpdatedVariant = {
                        ...oldVariant,
                        ...(serverVariant && typeof serverVariant === 'object' ? serverVariant : {}),
                        donGia: payload.donGia,
                        soLuongTon: payload.soLuongTon,
                        trangThai: payload.trangThai,
                        sanPham: oldVariant.sanPham
                    };

                    if (savedImageUrls !== null) {
                        localUpdatedVariant.hinhAnh = savedImageUrls[0] || null;
                        localUpdatedVariant.danhSachHinhAnh = savedImageUrls;
                    }

                    if (isVisibleVariant(localUpdatedVariant)) {
                        // Giữ nguyên vị trí dòng để cập nhật giá không làm dòng khác bị đẩy khỏi trang hiện tại.
                        allData[idx] = localUpdatedVariant;
                    } else {
                        allData.splice(idx, 1);
                    }
                    lastUpdatedVariantId = null;
                    forceShowUpdatedVariant = false;

                    setupPriceRange({ resetToMax: true });

                    go(page);
                } else {
                    // Nếu không tìm thấy trong allData (hiếm), tải lại toàn bộ
                    await loadAll();
                }
            } else {
                const err = await r.text();
                toast2('Lỗi: ' + err, 'error');
            }
        } catch (e) { toast2('Lỗi kết nối: ' + e.message, 'error'); }
    }

    // ======================== QR CODE SCANNER ========================
    // Thực hiện xử lý nghiệp vụ của hàm scan qr.
    function scanQR() {
        const modal = document.getElementById('scanModal');
        modal.classList.add('show');
        const reader = document.getElementById('reader');
        reader.innerHTML = '';
        const resultDiv = document.getElementById('scanResult');
        resultDiv.textContent = 'Đang mở camera...';

        if (!scanner) {
            scanner = new Html5Qrcode("reader");
        }
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        scanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
        );
    }

    // Xử lý tương tác người dùng cho on scan success.
    function onScanSuccess(decodedText, decodedResult) {
        const resultDiv = document.getElementById('scanResult');
        resultDiv.textContent = `Đã quét: ${decodedText}`;
        const found = allData.find(v => v.maChiTietSanPham === decodedText);
        if (found) {
            toast2(`Tìm thấy biến thể: ${found.maChiTietSanPham}`);

            closeScanModal();

        } else {
            toast2('Không tìm thấy biến thể với mã này', 'error');
            document.getElementById('kw').value = decodedText;
            closeScanModal();
            deb();
        }
    }

    function onScanError(err) {}

    function closeScanModal() {
        const modal = document.getElementById('scanModal');

    // ======================== TẢI QR CHO 1 BIẾN THỂ ========================
    // Thực hiện xử lý nghiệp vụ của hàm download single qr.
    async function downloadSingleQR(id) {
        const variant = allData.find(v => v.idSpct === id);
        if (!variant) { toast2('Không tìm thấy biến thể', 'error'); return; }
        const text = variant.maChiTietSanPham || `SP-${variant.idSpct}`;
        try {
            const dataUrl = await generateQRDataURL(text, 300);
            const link = document.createElement('a');
            link.download = `QR_${text}.png`;
            link.href = dataUrl;
            link.click();
            toast2('Đã tải QR cho ' + text);
        } catch (e) {
            toast2('Lỗi tạo QR: ' + e.message, 'error');
        }
    }

    // ======================== TẢI QR ĐÃ CHỌN (ZIP) ========================
    // Thực hiện xử lý nghiệp vụ của hàm download all qr.
    async function downloadAllQR() {
        const selected = getSelectedQrVariants();
        if (!selected.length) {
            toast2('Vui lòng chọn ít nhất một biến thể để tải QR', 'info');
            return;
        }
        toast2(`Đang tạo ${selected.length} ảnh QR...`, 'info');
        const zip = new JSZip();
        let count = 0;
        for (const v of selected) {
            const text = v.maChiTietSanPham || `SP-${v.idSpct}`;
            try {
                const dataUrl = await generateQRDataURL(text, 300);
                const blob = await fetch(dataUrl).then(r => r.blob());
                const fileName = `QR_${text}.png`;
                zip.file(fileName, blob);
                count++;
            } catch (e) {
                console.warn('Lỗi tạo QR cho', v.idSpct, e);
            }
        }
        if (count === 0) {
            toast2('Không thể tạo QR cho biến thể nào', 'error');
            return;
        }
        try {
            const content = await zip.generateAsync({ type: 'blob' });
            saveAs(content, `QR_BienThe_${new Date().toISOString().slice(0,10)}.zip`);
            toast2(`Đã tải xuống file ZIP chứa ${count} ảnh QR`);
        } catch (e) {
            toast2('Lỗi tạo ZIP: ' + e.message, 'error');
        }
    }

    // Thực hiện xử lý nghiệp vụ của hàm generate qrdata url.
    function generateQRDataURL(text, size) {
        return new Promise((resolve, reject) => {
            try {
                const container = document.createElement('div');
                container.style.display = 'none';
                document.body.appendChild(container);
                const qr = new QRCode(container, {
                    text: text,
                    width: size,
                    height: size,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                const canvas = container.querySelector('canvas');
                if (canvas) {
                    resolve(canvas.toDataURL('image/png'));
                } else {
                    reject('Không tìm thấy canvas');
                }
                container.remove();
            } catch (e) {
                reject(e);
            }
        });
    }

    // -- SEARCHABLE COMBOBOX --
    // Thực hiện xử lý nghiệp vụ của hàm combo escape html.
    function comboEscapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    // Thực hiện xử lý nghiệp vụ của hàm init searchable comboboxes.
    function initSearchableComboboxes(root=document){
        root.querySelectorAll('select').forEach(select=>{
            if(select.classList.contains('search-combo-source')){syncSearchCombo(select);return;}
            const combo=document.createElement('div');
            combo.className='search-combo';
            combo.innerHTML='<div class="search-combo-display" tabindex="0"></div><div class="search-combo-panel"><input class="search-combo-search" type="text" autocomplete="off" placeholder="Tìm kiếm..."><div class="search-combo-list"></div></div>';
            select.classList.add('search-combo-source');
            select.parentNode.insertBefore(combo, select.nextSibling);
            combo._select=select;
            const display=combo.querySelector('.search-combo-display');
            const search=combo.querySelector('.search-combo-search');
            display.addEventListener('click',()=>openSearchCombo(combo));
            display.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSearchCombo(combo)}});
            search.addEventListener('input',()=>renderSearchComboOptions(combo, search.value));
            search.addEventListener('keydown',e=>{if(e.key==='Escape') closeSearchCombo(combo)});
            select.addEventListener('change',()=>syncSearchCombo(select));
            new MutationObserver(()=>syncSearchCombo(select)).observe(select,{childList:true,subtree:true,attributes:true,attributeFilter:['selected','disabled']});
            syncSearchCombo(select);
        });
    }
    // Xử lý tương tác người dùng cho open search combo.
    function openSearchCombo(combo){
        if(combo.classList.contains('open')){closeSearchCombo(combo);return;}
        document.querySelectorAll('.search-combo.open').forEach(c=>{if(c!==combo)c.classList.remove('open')});
        combo.classList.add('open');
        const search=combo.querySelector('.search-combo-search');
        search.value='';
        renderSearchComboOptions(combo,'');
        setTimeout(()=>search.focus(),0);
    }
    // Xử lý thao tác đóng, xóa hoặc hủy cho close search combo.
    function closeSearchCombo(combo){combo.classList.remove('open')}
    // Thực hiện xử lý nghiệp vụ của hàm sync search combo.
    function syncSearchCombo(select){
        const combo=select.nextElementSibling?.classList?.contains('search-combo')?select.nextElementSibling:null;
        if(!combo)return;
        const selected=select.options[select.selectedIndex];
        combo.querySelector('.search-combo-display').textContent=selected?.textContent||select.querySelector('option')?.textContent||'Chọn';
        renderSearchComboOptions(combo, combo.querySelector('.search-combo-search')?.value||'');
    }
    // Hiển thị và đồng bộ giao diện cho render search combo options.
    function renderSearchComboOptions(combo, keyword){
        const select=combo._select;
        const list=combo.querySelector('.search-combo-list');
        const kw=String(keyword||'').trim().toLowerCase();
        const options=[...select.options].filter(o=>!o.disabled&&(!kw||o.textContent.toLowerCase().includes(kw)));
        if(!options.length){list.innerHTML='<div class="search-combo-empty">Không tìm thấy</div>';return;}
        list.innerHTML=options.map(o=>'<div class="search-combo-option '+(o.selected?'active':'')+'" data-value="'+comboEscapeHtml(o.value)+'">'+comboEscapeHtml(o.textContent)+'</div>').join('');
        list.querySelectorAll('.search-combo-option').forEach(item=>item.addEventListener('click',()=>{
            select.value=item.dataset.value;
            select.dispatchEvent(new Event('change',{bubbles:true}));
            closeSearchCombo(combo);
        }));
    }
    document.addEventListener('click',e=>{if(!e.target.closest('.search-combo'))document.querySelectorAll('.search-combo.open').forEach(closeSearchCombo)});
    document.addEventListener('DOMContentLoaded',()=>initSearchableComboboxes());
    if(!window._searchComboAutoSync){window._searchComboAutoSync=setInterval(()=>document.querySelectorAll('select.search-combo-source').forEach(syncSearchCombo),300)}

    // Thực hiện xử lý nghiệp vụ của hàm bind img upload clicks.
    function bindImgUploadClicks(root=document){
        root.querySelectorAll('.img-upload').forEach(el=>{
            el.style.cursor='pointer';
            try{ if(el._imgClickHandler) el.removeEventListener('click', el._imgClickHandler); }catch(e){}
            const h = (e)=>{
                if(e.target && e.target.tagName && e.target.tagName.toLowerCase()==='input') return;
                const inp = el.querySelector('input[type=file]'); if(inp) inp.click();
            };
            el.addEventListener('click', h);
            el._imgClickHandler = h;
        });
    }
    document.addEventListener('DOMContentLoaded', ()=>bindImgUploadClicks());
</script>
</body>
</html>
