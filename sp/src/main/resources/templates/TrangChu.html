<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ | 4MenStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/js/app-shell.js?v=ui-scale-20260831-3" defer></script>
    <style>
        :root {
            --bg: #f2f5f9;
            --line: #e3eaf2;
            --ink: #263a56;
            --muted: #74839a;
            --navy: #102a56;
            --navy-hover:#173d78;
            --navy-2: #1a4a8a;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .page {
            padding: 26px;
        }

        .hero {
            margin-bottom: 18px;
            padding: 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--navy), var(--navy-2));
            color: #fff;
            box-shadow: 0 14px 34px rgba(16, 42, 86, .22);
        }

        .hero-title {
            margin: 0 0 6px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .hero-sub {
            color: rgba(255, 255, 255, .84);
            font-size: 13px;
            line-height: 1.55;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .card {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--white);
            box-shadow: 0 8px 20px rgba(40, 66, 101, .06);
        }

        .card-title {
            margin-bottom: 10px;
            color: #314763;
            font-size: 13px;
            font-weight: 800;
        }

        .metric {
            color: var(--navy);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .metric-label {
            margin-top: 4px;
            color: var(--muted);
        }

        .quick-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .quick-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 42px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: #314763;
            text-decoration: none;
            font-weight: 700;
            transition: .16s ease;
        }

        .quick-link:hover {
            border-color: #b8c8db;
            background: #f9fbfd;
        }

        .card-text {
            color: #4f6078;
            line-height: 1.6;
        }

        .loading-box,
        .empty-box {
            padding: 22px;
            border: 1px dashed #cfd9e6;
            border-radius: 12px;
            background: #fff;
            color: #71819a;
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 1100px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 14px;
            }

            .hero {
                padding: 18px;
            }

            .hero-title {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
<aside class="sidebar"></aside>

<main class="main">
    <section class="page">
        <section class="hero">
            <h1 class="hero-title" id="heroTitle">Xin chào</h1>
            <div class="hero-sub" id="heroSub">
                Chào mừng bạn quay lại hệ thống quản trị 4MenStore.
            </div>
        </section>

        <section id="dashboardGrid" class="grid">
            <div class="loading-box" style="grid-column: 1 / -1;">
                Đang tải dữ liệu người dùng...
            </div>
        </section>
    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', initDashboard);

    // Thực hiện xử lý nghiệp vụ của hàm init dashboard.
    async function initDashboard() {
        const user = await getCurrentEmployee();

        if (!user) {
            window.location.href = '/dang-nhap';
            return;
        }

        const isManager = isManagerRole(user.vaiTro);

        document.getElementById('heroTitle').textContent =
            `Xin chào, ${user.hoTen || 'bạn'}`;

        document.getElementById('heroSub').textContent = isManager
            ? 'Bạn đang đăng nhập với quyền quản lý. Hệ thống hiển thị đầy đủ các chức năng quản trị.'
            : 'Bạn đang đăng nhập với quyền nhân viên. Hệ thống chỉ hiển thị các chức năng được phép sử dụng.';

        renderCards(isManager);
    }

    // Tải hoặc truy xuất dữ liệu cho get current employee.
    async function getCurrentEmployee() {
        try {
            const response = await fetch('/api/nhanvien/auth/me', {
                credentials: 'same-origin'
            });

            if (!response.ok) {
                return null;
            }

            return await response.json();
        } catch {
            return null;
        }
    }

    // Hiển thị và đồng bộ giao diện cho render cards.
    function renderCards(isManager) {
        const cards = isManager
            ? [
                cardMetric('Tổng quan hệ thống', 'Manager mode'),
                cardLinks('Đi nhanh', [
                    ['Trang chủ', '/san-pham/trang-chu'],
                    ['Bán hàng tại quầy', '/ban-hang-tai-quay'],
                    ['Quản lý hóa đơn', '/hoa-don'],
                    ['Chat hỗ trợ', '/chat-ho-tro'],
                    ['Quản lý sản phẩm', '/san-pham/quan-ly'],
                    ['Khách hàng', '/khach-hang'],
                    ['Nhân viên', '/nhan-vien'],
                    ['Thống kê', '/thong-ke']
                ]),
                cardText(
                    'Quyền quản lý',
                    'Bạn có thể quản lý nhân sự, sản phẩm, khách hàng, chương trình giảm giá, thống kê và các cấu hình vận hành của hệ thống.'
                ),
                cardText(
                    'Nhắc việc',
                    'Theo dõi doanh thu, tồn kho, đơn hàng chờ xử lý và các chương trình giảm giá đang hoạt động.'
                )
            ]
            : [
                cardMetric('Màn hình làm việc', 'Staff mode'),
                cardLinks('Đi nhanh', [
                    ['Trang chủ', '/trang-chu'],
                    ['Bán hàng tại quầy', '/ban-hang-tai-quay'],
                    ['Quản lý hóa đơn', '/hoa-don'],
                    ['Chat hỗ trợ', '/chat-ho-tro'],
                    ['Khách hàng', '/khach-hang']
                ]),
                cardText(
                    'Quyền nhân viên',
                    'Bạn chỉ thấy các màn được cấp quyền, không hiển thị quản trị nhân viên, thống kê, phiếu giảm giá và đặt giảm giá.'
                ),
                cardText(
                    'Nhắc việc',
                    'Ưu tiên xử lý bán hàng, cập nhật hóa đơn và hỗ trợ khách hàng trong ca làm việc.'
                )
            ];

        document.getElementById('dashboardGrid').innerHTML = cards.join('');
    }

    // Thực hiện xử lý nghiệp vụ của hàm card metric.
    function cardMetric(title, value) {
        return `
            <article class="card">
                <div class="card-title">${title}</div>
                <div class="metric">${value}</div>
                <div class="metric-label">Giao diện tự động theo vai trò đang nhập</div>
            </article>
        `;
    }

    // Thực hiện xử lý nghiệp vụ của hàm card links.
    function cardLinks(title, links) {
        return `
            <article class="card">
                <div class="card-title">${title}</div>
                <div class="quick-list">
                    ${links.map(([label, href]) => `
                        <a class="quick-link" href="${href}">
                            <span>${label}</span>
                            <span>→</span>
                        </a>
                    `).join('')}
                </div>
            </article>
        `;
    }

    // Thực hiện xử lý nghiệp vụ của hàm card text.
    function cardText(title, text) {
        return `
            <article class="card">
                <div class="card-title">${title}</div>
                <div class="card-text">${text}</div>
            </article>
        `;
    }

    // Kiểm tra điều kiện và tính hợp lệ cho is manager role.
    function isManagerRole(role) {
        const value = String(role || '')
            .trim()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase();

        if (!value) {
            return false;
        }

        return !value.includes('nhan vien')
            && !value.includes('nhanvien')
            && !value.includes('staff')
            && !value.includes('employee');
    }
</script>
</body>
</html>
